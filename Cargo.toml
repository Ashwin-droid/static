[package]
name = "static"
version = "1.0.0"
edition = "2024"
description = "A YouTube Music client built with Rust and iced"
authors = ["Ashwin Mhaskar"]
license = "MIT"

[package.metadata.deb]
maintainer = "Ashwin Mhaskar"
features = ["staticfs"]
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad"
section = "sound"
priority = "optional"
assets = [
    ["target/release/static", "usr/bin/", "755"],
    ["assets/static.desktop", "usr/share/applications/com.static.music.desktop", "644"],
    ["assets/static.png", "usr/share/icons/hicolor/256x256/apps/com.static.music.png", "644"],
]

[dependencies]
# iced UI (see src/ui/)
iced = { version = "0.14", features = ["tokio", "image", "svg", "lazy"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
chrono = "0.4"

# SAPISIDHASH auth
sha1 = "0.10"

regex = "1"
url = "2"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"

# Secret Service (GNOME Keyring) access via raw zbus

# GStreamer audio playback
dbus = "0.9"
gstreamer = "0.25"
gstreamer-play = "0.25"
rustfft = "6"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
include_dir = "0.7"
base64 = "0.22"
ab_glyph = "0.2"
material-colors = "0.4.2"
mpris = "2"
mpris-server = "0.9"
pipewire = "0.8"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Offline cache DB
rusqlite = { version = "0.34", features = ["bundled"] }
rand = "0.10.0"
uuid = { version = "1.22.0", features = ["v4"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
zbus = { version = "4", features = ["blocking"] }
libc = "0.2"
fuser = { version = "0.17.0", optional = true }
reed-solomon = "0.2.1"
crc32fast = "1.5.0"
blind_watermark = "=0.1.3"
bitvec = "1.0"

[patch.crates-io]
libspa-sys = { path = "vendor/libspa-sys" }
pipewire-sys = { path = "vendor/pipewire-sys" }

[features]
staticfs = ["dep:fuser"]
