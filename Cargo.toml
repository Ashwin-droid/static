[package]
name = "static"
version = "1.0.0"
edition = "2024"
description = "A YouTube Music client built with Rust and GTK4"
authors = ["Ashwin Mhaskar"]
license = "MIT"

[package.metadata.deb]
maintainer = "Ashwin Mhaskar"
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad"
section = "sound"
priority = "optional"
assets = [
    ["target/release/static", "usr/bin/", "755"],
    ["assets/static.desktop", "usr/share/applications/com.static.music.desktop", "644"],
    ["assets/static.png", "usr/share/icons/hicolor/256x256/apps/com.static.music.png", "644"],
]

[dependencies]
# GTK4 UI
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
chrono = "0.4"

# SAPISIDHASH auth
sha1 = "0.10"

regex = "1"
url = "2"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "8.0.1", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"

# Secret Service (GNOME Keyring) access via raw zbus

# GStreamer audio playback
dbus = "0.9"
gstreamer = "0.25"
gstreamer-play = "0.25"
mpris = "2"
mpris-server = "0.9"
pipewire = "0.8"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Offline cache DB
rusqlite = { version = "0.34", features = ["bundled"] }
rand = "0.10.0"
uuid = { version = "1.22.0", features = ["v4"] }
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
zbus = { version = "4", features = ["blocking"] }

[patch.crates-io]
libspa-sys = { path = "vendor/libspa-sys" }
pipewire-sys = { path = "vendor/pipewire-sys" }
