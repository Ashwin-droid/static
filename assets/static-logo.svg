<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle static/noise lines in background -->
  <g clip-path="url(#roundClip)" opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="512" y2="80"/>
    <line x1="0" y1="120" x2="512" y2="120"/>
    <line x1="0" y1="160" x2="512" y2="160"/>
    <line x1="0" y1="200" x2="512" y2="200"/>
    <line x1="0" y1="240" x2="512" y2="240"/>
    <line x1="0" y1="280" x2="512" y2="280"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="360" x2="512" y2="360"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
    <line x1="0" y1="440" x2="512" y2="440"/>
  </g>

  <!-- Audio waveform / "static" bars -->
  <g clip-path="url(#roundClip)">
    <!-- Left side waveform bars -->
    <rect x="68"  y="226" width="16" height="60" rx="8" fill="url(#accent)" opacity="0.5"/>
    <rect x="96"  y="196" width="16" height="120" rx="8" fill="url(#accent)" opacity="0.6"/>
    <rect x="124" y="166" width="16" height="180" rx="8" fill="url(#accent)" opacity="0.7"/>
    <rect x="152" y="206" width="16" height="100" rx="8" fill="url(#accent)" opacity="0.55"/>
    <rect x="180" y="186" width="16" height="140" rx="8" fill="url(#accent)" opacity="0.65"/>

    <!-- Right side waveform bars -->
    <rect x="316" y="186" width="16" height="140" rx="8" fill="url(#accent)" opacity="0.65"/>
    <rect x="344" y="206" width="16" height="100" rx="8" fill="url(#accent)" opacity="0.55"/>
    <rect x="372" y="166" width="16" height="180" rx="8" fill="url(#accent)" opacity="0.7"/>
    <rect x="400" y="196" width="16" height="120" rx="8" fill="url(#accent)" opacity="0.6"/>
    <rect x="428" y="226" width="16" height="60" rx="8" fill="url(#accent)" opacity="0.5"/>
  </g>

  <!-- Center music note -->
  <g transform="translate(194, 148)">
    <!-- Note stem -->
    <rect x="62" y="0" width="12" height="160" rx="6" fill="url(#accent2)"/>
    <!-- Flag -->
    <path d="M74 0 C74 0, 120 10, 120 45 C120 80, 74 65, 74 65" fill="url(#accent2)"/>
    <!-- Note head -->
    <ellipse cx="42" cy="160" rx="36" ry="28" transform="rotate(-20, 42, 160)" fill="url(#accent2)"/>
  </g>

  <!-- Glow effect behind the note -->
  <ellipse cx="256" cy="290" rx="90" ry="70" fill="#a855f7" opacity="0.08" filter="blur(20px)"/>

  <!-- "S" lettermark at bottom -->
  <text x="256" y="448" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="12" fill="white" opacity="0.9">STATIC</text>
</svg>
